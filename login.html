<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KFitness — вход</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg:#050505; --tx:#f5f5f5; --mut:#8d8d93;
    --line:rgba(255,255,255,.09); --card:rgba(255,255,255,.045);
    --red:#ff2d45; --grad:linear-gradient(135deg,#ff4d5e 0%,#e0112b 55%,#8a0016 100%);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html,body { margin:0; height:100% }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(40% 50% at 70% 25%, rgba(255,30,60,.22), transparent 70%),
      radial-gradient(35% 45% at 20% 10%, rgba(255,255,255,.05), transparent 70%);
    color:var(--tx);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box { width:100%; max-width:360px; text-align:center }
  .brand { color:var(--red); font-weight:800; letter-spacing:.2em; font-size:12px; margin-bottom:10px }
  h1 { font-size:28px; margin:0 0 6px }
  .hint { color:var(--mut); font-size:14px; margin:0 0 28px }
  input {
    width:100%; height:74px; text-align:center;
    letter-spacing:.4em; font-size:30px; font-weight:700;
    text-transform:uppercase; color:var(--tx);
    background:var(--card); border:1px solid var(--line);
    border-radius:18px; outline:none; transition:.2s;
  }
  input:focus { border-color:var(--red); box-shadow:0 0 0 4px rgba(255,45,69,.15) }
  input::placeholder { color:#3a3a40; letter-spacing:.2em }
  button {
    width:100%; height:66px; margin-top:16px;
    font-size:19px; font-weight:800; letter-spacing:.05em; color:#fff;
    background:var(--grad); border:0; border-radius:18px;
    cursor:pointer; transition:.2s;
    box-shadow:0 10px 30px rgba(255,30,60,.35);
  }
  button:disabled { opacity:.4; box-shadow:none; cursor:default }
  .err { min-height:20px; margin-top:14px; color:var(--red); font-size:14px; font-weight:600 }
</style>
</head>
<body>
  <div class="box">
    <div class="brand">KFITNESS</div>
    <h1>Вход</h1>
    <p class="hint">Введите код, который выдал тренер</p>
    <input id="code" maxlength="4" inputmode="text"
           autocomplete="off" autocapitalize="characters"
           autofocus placeholder="····">
    <button id="go">ВОЙТИ</button>
    <div class="err" id="err"></div>
  </div>
<script>
  var inp = document.getElementById('code');
  var btn = document.getElementById('go');
  var err = document.getElementById('err');

  inp.addEventListener('input', function () {
    inp.value = inp.value.toUpperCase().replace(/[^A-ZА-Я0-9]/gi, '');
    err.textContent = '';
  });
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') go();
  });
  btn.addEventListener('click', go);

  async function go() {
    var code = inp.value.trim();
    if (code.length < 4) { err.textContent = 'Код короткий'; return; }
    btn.disabled = true;
    err.textContent = '';
    try {
      var r = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
      });
      var d = await r.json().catch(function () { return {}; });
      if (r.ok && d.ok) { location.href = '/'; return; }
      err.textContent = d.error || 'Неверный код';
    } catch (e) {
      err.textContent = 'Нет связи с сервером';
    }
    btn.disabled = false;
  }
</script>
</body>
</html>
